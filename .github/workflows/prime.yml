
name: PRIME - Auto forecasts

on:
  workflow_dispatch:
  schedule:
    - cron: '7 * * * *'

permissions:
  contents: write

concurrency:
  group: prime-forecasts
  cancel-in-progress: false

jobs:
  forecasts:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install "Pillow>=10,<13" "cairosvg>=2.7,<3"

      - name: Check Python syntax
        run: python -m py_compile bot.py winner_model.py totals_model.py khl_source.py khl_history.py

      - name: Collect KHL completed games
        run: python khl_history.py

      - name: Run PRIME bot
        run: python bot.py

      - name: Save forecasts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/state.json data/predictions.json data/khl_history.json
          if ! git diff --cached --quiet; then
            git commit -m "Update PRIME forecasts"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
